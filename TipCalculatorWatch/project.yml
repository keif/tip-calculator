name: TipCalculatorWatch
options:
  bundleIdPrefix: com.tipcalculator
  deploymentTarget:
    watchOS: "10.0"

settings:
  base:
    SDKROOT: watchos

targets:
  TipCalculatorWatch:
    type: application
    platform: watchOS
    sources:
      - TipCalculatorWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tipcalculator.watchapp
        PRODUCT_NAME: Tip Calculator
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_WKWatchOnly: YES
